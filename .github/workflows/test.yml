name: test

on:
  push:
    branches: ["main"]
    paths:
      - "**/src/**"
      - "**/Cargo.toml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/src/**"
      - "**/Cargo.toml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo-test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-gnu

          - os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc

          - os: macos-latest
            rust: stable
            target: x86_64-apple-darwin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}

      - name: Cache Build Artifacts
        uses: Swatinem/rust-cache@v2.8.2

      - name: Run Tests
        run: cargo test --all-targets --all-features --target ${{ matrix.target }}
