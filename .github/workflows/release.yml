name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            binary: aleym_api
            electron-output: dist/*.AppImage

          - os: macos-latest
            rust-target: x86_64-apple-darwin
            binary: aleym_api
            electron-output: dist/*.zip

          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            binary: aleym_api.exe
            electron-output: dist/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout aleym_api
        uses: actions/checkout@v6

      - name: Checkout AlyemUI
        uses: actions/checkout@v6
        with:
          repository: NezarAltarouti/AlyemUI
          path: alyemui

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build AlyemUI
        working-directory: alyemui
        run: |
          npm ci
          npm run build

      - name: Copy frontend into web/dist
        shell: bash
        run: |
          mkdir -p web/dist
          cp -r alyemui/dist/* web/dist/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust binary
        run: cargo build --release --target ${{ matrix.rust-target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p electron/bin
          cp target/${{ matrix.rust-target }}/release/${{ matrix.binary }} electron/bin/
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x electron/bin/${{ matrix.binary }}
          fi

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Electron app
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: aleym-${{ matrix.os }}
          path: electron/${{ matrix.electron-output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
